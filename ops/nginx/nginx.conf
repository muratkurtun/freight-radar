user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile         on;
    tcp_nopush       on;
    keepalive_timeout 65;

    # Gzip — cheap win for JSON responses and JS bundles.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Hide the nginx version in the Server header and error pages.
    server_tokens off;

    # Modest limits — tune if you start accepting uploads.
    client_max_body_size 1m;

    include /etc/nginx/conf.d/*.conf;
}
