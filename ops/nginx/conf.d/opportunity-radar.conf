# Replace ${DOMAIN} with your real domain (e.g. opportunityradar.com)
# once before first `docker compose up`. Two occurrences total.
#
# The HTTPS server block references cert files that only exist AFTER
# Let's Encrypt bootstrap. See ops/init-letsencrypt.sh for the flow:
# the bootstrap script drops a self-signed dummy cert first so nginx
# can start, then swaps in the real cert from certbot.

upstream or_backend  { server backend:8000; }
upstream or_frontend { server frontend:80;  }

# --- HTTP: ACME challenges + redirect everything else to HTTPS --------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real app ---------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Modern baseline — TLS 1.2+ only.
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # HSTS — tells the browser "always HTTPS". Start with a short
    # max-age on day one; bump to 1 year once you're confident.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options         "DENY"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # FastAPI routes are un-prefixed (/auth/..., /opportunities, ...).
    # The trailing slash on proxy_pass strips /api/ before forwarding,
    # so the frontend can talk to /api/* while the backend keeps its
    # clean route names.
    location /api/ {
        proxy_pass         http://or_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Everything else → the Angular SPA (its own nginx handles the
    # SPA fallback on a miss).
    location / {
        proxy_pass         http://or_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
