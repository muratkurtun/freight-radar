server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets; Angular's build hashes filenames.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached aggressively — otherwise
    # users hold onto stale hashes that reference missing chunks after
    # a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: every unknown path returns index.html so Angular's
    # client-side router handles deep links (/reviews/pending etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
