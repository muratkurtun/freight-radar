<div class="auth-wrap">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Opportunity Radar</h1>
    <p class="subtitle">7 günlük ücretsiz denemeyi başlat</p>

    <label>
      <span>Şirket Adı</span>
      <input type="text" formControlName="tenant_name" autocomplete="organization" />
    </label>

    <label>
      <span>Ad Soyad</span>
      <input type="text" formControlName="full_name" autocomplete="name" />
    </label>

    <label>
      <span>E-posta</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      <span>Şifre (min 8 karakter)</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (error(); as err) {
      <div class="error">{{ err }}</div>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Oluşturuluyor…' : 'Hesap Oluştur' }}
    </button>

    <p class="alt">
      Zaten hesabın var mı? <a routerLink="/login">Giriş Yap</a>
    </p>
  </form>
</div>
