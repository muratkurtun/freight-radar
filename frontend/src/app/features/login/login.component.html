<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Opportunity Radar</h1>
    <p class="subtitle">Admin Panel · Oturum Aç</p>

    <label>
      <span>E-posta</span>
      <input type="email" formControlName="email" autocomplete="email" autofocus />
    </label>

    <label>
      <span>Şifre</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error(); as err) {
      <div class="error">{{ err }}</div>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Giriş yapılıyor…' : 'Giriş Yap' }}
    </button>

    <p class="alt">
      Hesabın yok mu? <a routerLink="/register">7 Gün Ücretsiz Dene</a>
    </p>
  </form>
</div>
