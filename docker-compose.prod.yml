# Production orchestration for a single Hetzner VPS.
#
# Same four app services as dev (postgres, backend, frontend) plus an
# edge nginx that does TLS termination and a certbot sidecar for
# Let's Encrypt issuance / renewal. No bind mounts on source, no
# --reload, no Node in the runtime image.
#
# Host exposure:
#   nginx    -> 80, 443  (public)
#   postgres, backend, frontend -> internal network only
#
# Secrets come from ./env on the host (chmod 600, not in git).

services:
  postgres:
    image: postgres:16-alpine
    container_name: or_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 10
    # No ports: section — DB is reachable only from other containers on
    # the compose network.

  backend:
    build:
      context: ./backend
    container_name: or_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      # Single-worker deployment → scheduler is safe ON here. If you add
      # a second backend replica later, turn this OFF on the replicas.
      SCHEDULER_ENABLED: "true"
      PIPELINE_INTERVAL_MINUTES: ${PIPELINE_INTERVAL_MINUTES}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      CORS_ORIGINS: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    # Default CMD from backend/Dockerfile: uvicorn without --reload.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: or_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: or_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    # Reload nginx every 12h so newly-issued / renewed certs are picked up.
    command: >
      /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: or_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Try to renew every 12h; certbot itself is a no-op if the cert is
    # still fresh, so this is cheap.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  pg_data:
  certbot_conf:
  certbot_webroot:
